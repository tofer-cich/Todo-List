<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoIfy</title>
</head>
<body>
    <h1>ToDoIfy</h1>
    <nav>
        <button>Create Project</button>
    </nav>
    <div id="content">
        <div id="project-window">
            <div class="card">
                <h3>Project</h3>
                <p>DueDate here</p>
                <ul>
                    <li>
                        <button>Open</button>
                    </li>
                    <li>
                        <button>Delete</button>
                    </li>
                </ul>
            </div>            
        </div>
        <div id="todo-window">
            <h2 id="todo-project-title"></h2>
            <button>Add</button>
            <div id="todo-container"></div>
        </div>
    </div>
</body>
</html>
